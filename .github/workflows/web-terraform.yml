name: web-terraform

# Infrastructure for the Miraomics website (miraomics-web/infra).
# PRs touching infra/lambda get fmt + validate + plan; merges to main apply.

on:
  pull_request:
    paths:
      - "miraomics-web/infra/**"
      - ".github/workflows/web-terraform.yml"
  push:
    branches: [main]
    paths:
      - "miraomics-web/infra/**"
      - ".github/workflows/web-terraform.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC -> AWS
  contents: read
  pull-requests: write # to comment the plan

concurrency:
  group: web-terraform
  cancel-in-progress: false

defaults:
  run:
    working-directory: miraomics-web/infra/terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = `#### Terraform plan 📖\n\`\`\`\n${{ steps.plan.outputs.stdout || 'see logs' }}\n\`\`\``;
            // Plan output can be large; truncate to keep the comment valid.
            const body = out.length > 65000 ? out.slice(0, 65000) + '\n…truncated' : out;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
